<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lịch Tham Gia - Non-Nerd Society</title>
    
    <!-- Favicon biểu tượng chú bò trên tab trình duyệt -->
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Thư viện nạp dữ liệu CSV từ Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- CSS DÙNG CHUNG TOÀN HỆ THỐNG -->
    <link rel="stylesheet" href="style.css">

    <style>
        .page-container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 60px 20px 100px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-header h1 {
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-size: clamp(2.8rem, 6vw, 4.2rem);
            margin-bottom: 12px;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .event-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--box-shadow);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .badge-open {
            color: #84CC16;
            background: rgba(132, 204, 22, 0.15);
        }

        .badge-upcoming {
            color: var(--tagline-color);
            background: rgba(168, 85, 247, 0.15);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 540px;
            position: relative;
        }

        .close-modal-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .events-grid { grid-template-columns: 1fr; gap: 20px; }
            .event-card { padding: 20px; }
            .page-header h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="sub-header">
        <span>NON-NERD SOCIETY</span>
        <span>TRUNG TÂM ĐẶT LỊCH SỰ KIỆN</span>
    </div>

    <div class="page-container">
        <div class="page-header">
            <p style="font-size: 0.9rem; font-weight: 700; letter-spacing: 2px; color: var(--tagline-color); margin-bottom: 8px;">ĐẶT CHỖ TRỰC TUYẾN</p>
            <h1>Lựa Chọn Sự Kiện & Giữ Chỗ</h1>
            <p style="color: var(--text-muted); max-width: 650px; margin: 0 auto;">Dưới đây là danh sách tổng hợp tất cả các sự kiện và workshop đang mở đăng ký.</p>
        </div>

        <!-- DANH SÁCH TỔNG HỢP CÁC SỰ KIỆN -->
        <div class="events-grid" id="events-grid-container">
            <p style="text-align: center; grid-column: 1/-1; color: var(--text-muted);">Đang tải danh sách sự kiện...</p>
        </div>
    </div>

    <!-- Modal Đặt Lịch Gửi Trực Tiếp Về Google Apps Script & Sheet -->
    <div class="modal-overlay" id="booking-modal" onclick="closeModalOutside(event)">
        <div class="modal-card">
            <button class="close-modal-btn" onclick="closeModal()">&times;</button>
            <h2 style="font-size: 1.5rem; margin-bottom: 4px;">ĐẶT CHỖ THAM GIA</h2>
            <p style="color: var(--text-muted); margin: 0 0 20px; font-size: 0.92rem;">Điền thông tin để đăng ký tham gia sự kiện.</p>
            
            <form id="booking-form" onsubmit="handleBookingSubmit(event)">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">HỌ VÀ TÊN</label>
                    <input type="text" id="form-name" required placeholder="Họ và tên của bạn" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-line); background-color: var(--bg-body); color: var(--text-main); outline: none;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">EMAIL / SỐ ĐIỆN THOẠI</label>
                    <input type="text" id="form-contact" required placeholder="name@example.com hoặc 09..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-line); background-color: var(--bg-body); color: var(--text-main); outline: none;">
                </div>

                <div style="margin-bottom: 22px;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">CHỌN SỰ KIỆN THAM GIA</label>
                    <select id="event-select" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-line); background-color: var(--bg-body); color: var(--text-main); outline: none; cursor: pointer; font-family: inherit;">
                        <option value="">Đang nạp danh sách sự kiện...</option>
                    </select>
                </div>

                <button type="submit" id="btn-submit-booking" class="btn-frame" style="width: 100%; margin-top: 0; padding: 12px;">Xác nhận đăng ký</button>
            </form>
        </div>
    </div>

    <!-- Script Tự động nạp Header, Drawer & Footer -->
    <script src="layout.js"></script>

    <script>
        // ================= 1. MODAL POPUP ĐẶT LỊCH =================
        const modal = document.getElementById('booking-modal');
        
        function openModal(eventName = null) {
            modal.style.display = 'flex';
            if (eventName) {
                const selectEl = document.getElementById('event-select');
                for (let i = 0; i < selectEl.options.length; i++) {
                    if (selectEl.options[i].value.includes(eventName) && !selectEl.options[i].disabled) {
                        selectEl.selectedIndex = i;
                        break;
                    }
                }
            }
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function closeModalOutside(e) {
            if (e.target === modal) {
                closeModal();
            }
        }

        // ================= 2. NẠP TOÀN BỘ SỰ KIỆN TỪ GOOGLE SHEET =================
        const CSV_EXPORT_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQBd2OjG6UljeEH1ZS3VSFT0Y4kGX3RCHNSWrVn8BvdinH53mQJWD22PaevlRsENEmI1iJ6zE3Tt5zf/pub?gid=0&single=true&output=csv";

        Papa.parse(CSV_EXPORT_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const container = document.getElementById('events-grid-container');
                const selectEl = document.getElementById('event-select');
                
                container.innerHTML = '';
                if (selectEl) selectEl.innerHTML = '';

                let hasEvents = false;

                results.data.forEach(item => {
                    const tieuDe = (item.TieuDe || item.tieude || item.Title || item.title || '').trim();
                    const moTa = (item.MoTa || item.mota || item.Description || item.description || '').trim();
                    const thoiGian = (item.ThoiGian || item.thoigian || item.Time || item.time || '').trim();
                    const diaDiem = (item.DiaDiem || item.diadiem || item.Location || item.location || '').trim();
                    const trangThai = (item.TrangThai || item.trangthai || item.Status || item.status || '').trim();

                    if (!tieuDe) return;

                    hasEvents = true;
                    const isOpen = trangThai.toLowerCase() === 'open';

                    const card = document.createElement('div');
                    card.className = 'event-card';
                    card.innerHTML = `
                        <div>
                            <span class="badge ${isOpen ? 'badge-open' : 'badge-upcoming'}">
                                ${isOpen ? 'ĐANG MỞ ĐĂNG KÝ' : 'SẮP DIỄN RA'}
                            </span>
                            <h3 style="font-size: 1.3rem; margin-bottom: 8px;">${tieuDe}</h3>
                            <p style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 16px;">${moTa}</p>
                            <div style="font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px;">
                                <span><i class="fa-regular fa-clock" style="width: 18px;"></i> ${thoiGian}</span>
                                <span><i class="fa-solid fa-location-dot" style="width: 18px;"></i> ${diaDiem}</span>
                            </div>
                        </div>
                        <button class="btn-frame" style="width: 100%; margin-top: 20px; padding: 10px;" ${!isOpen ? 'style="opacity: 0.6; cursor: not-allowed;" onclick="alert(\'Sự kiện này chưa mở đăng ký!\')"' : `onclick="openModal('${tieuDe}')"`}>
                            ${isOpen ? 'Đặt chỗ ngay' : 'Chưa mở đăng ký'}
                        </button>
                    `;
                    container.appendChild(card);

                    if (selectEl) {
                        const option = document.createElement('option');
                        option.value = `${tieuDe} (${thoiGian})`;
                        option.textContent = `${tieuDe} (${thoiGian}${isOpen ? ' - Đang mở' : ' - Chưa mở'})`;
                        if (!isOpen) {
                            option.disabled = true;
                            option.style.color = 'var(--text-muted)';
                        }
                        selectEl.appendChild(option);
                    }
                });

                if (!hasEvents) {
                    container.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: var(--text-muted);">Hiện chưa có sự kiện nào được đăng.</p>';
                }
            },
            error: function(err) {
                console.error("Lỗi PapaParse:", err);
                document.getElementById('events-grid-container').innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: var(--tagline-color);">Không thể tải dữ liệu sự kiện lúc này.</p>';
            }
        });

        // ================= 3. GỬI DỮ LIỆU ĐĂNG KÝ VỀ GOOGLE APPS SCRIPT =================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNskwJqAhXIXxv8aXeKRIA0U4CmtSFptyDCWS2r-LShO1YWp3LCNaVGVg3ImlCaSs2yg/exec";

        async function handleBookingSubmit(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('btn-submit-booking');
            const name = document.getElementById('form-name').value.trim();
            const contact = document.getElementById('form-contact').value.trim();
            const event = document.getElementById('event-select').value;

            if (!name || !contact || !event) {
                alert("Vui lòng điền đầy đủ thông tin.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Đang gửi đăng ký...";

            const payload = {
                type: "booking",
                name: name,
                contact: contact,
                event: event
            };

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });

                alert("🎉 Đặt chỗ thành công! Ban tổ chức sẽ sớm liên hệ xác nhận với bạn.");
                document.getElementById('booking-form').reset();
                closeModal();
            } catch (err) {
                console.error("Lỗi gửi dữ liệu:", err);
                alert("Có lỗi xảy ra khi gửi thông tin. Vui lòng thử lại!");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Xác nhận đăng ký";
            }
        }
    </script>
</body>
</html>
