<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Nerd Society - 5 phút để kể, cả tối để quen nhau</title>
    
    <!-- Favicon biểu tượng chú bò trên tab trình duyệt -->
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS DÙNG CHUNG -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* CSS Riêng cho Phần Hero Trang Chủ */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px 80px;
            max-width: 900px;
            margin: 0 auto;
        }

        .illustration-box {
            margin-bottom: 24px;
        }

        .hero-center-img {
            width: 100%;
            max-width: 230px;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            animation: float 4s ease-in-out infinite;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        body:not(.dark-mode) .hero-center-img {
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
        }

        body.dark-mode .hero-center-img {
            filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.4));
        }

        .tagline-small {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--tagline-color);
            margin-bottom: 8px;
        }

        .hero-title {
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            font-weight: 400;
            line-height: 1.05;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #B24BF3 0%, #A855F7 30%, #97E31B 70%, #84CC16 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .squiggle {
            width: 140px;
            height: 12px;
            margin: 0 auto 24px;
            stroke: var(--tagline-color);
            fill: none;
            stroke-width: 3;
        }

        .hero-description {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 680px;
            margin-bottom: 36px;
        }

        .hero-description strong {
            color: var(--text-main);
        }

        @media (max-width: 768px) {
            .hero { padding: 36px 16px 60px; }
            .hero-description { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Canvas vẽ hiệu ứng nền tự chuyển đổi (Chỉ cần có thẻ này, canvas-bg.js sẽ tự chạy) -->
    <canvas id="bg-canvas"></canvas>

    <div class="sub-header">
        <span>NON-NERD SOCIETY</span>
        <span>Thành phố Hồ Chí Minh</span>
    </div>

    <!-- KHU VỰC HERO CHÍNH TRANG CHỦ -->
    <main class="hero">
        <div class="illustration-box">
            <img src="hero-banner.png" alt="Non-Nerd Banner" class="hero-center-img">
        </div>

        <p class="tagline-small">Dù non dù nerd • Từ khờ lên khôn</p>
        <h1 class="hero-title">Non-Nerd Night</h1>

        <svg class="squiggle" viewBox="0 0 100 10">
            <path d="M0 5 Q 25 0, 50 5 T 100 5" />
        </svg>

        <p class="hero-description">
            Giữ tò mò của mầm Non • Nuôi say mê của một Nerd 
            <br>
            <strong>Cùng kết nối ◇ Cùng lắng nghe</strong>
        </p>

        <a href="request.html" class="btn-frame">
            Xem các đêm sắp tới
        </a>
    </main>

    <!-- Nạp Script Layout chung & Canvas Background -->
    <script src="layout.js"></script>
    <script src="canvas-bg.js"></script>
</body>
</html>
